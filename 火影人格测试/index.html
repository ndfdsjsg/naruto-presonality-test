    "完全不符合",

/* =========================================================
   渲染题目
========================================================= */

function renderQuestions(){

    const form =
        document.getElementById("testForm");

    let html = "";

    questions.forEach(
        (question,index)=>{

            html += `

            <div class="question">

                <div class="question-title">

                    ${index + 1}.
                    ${question.text}

                </div>

                <div class="options">

                    ${
                        optionTexts
                        .map(
                            (text,optIndex)=>`

                            <div class="option-item">

                                <input
                                    type="radio"
                                    name="q${index}"
                                    id="q${index}_${optIndex}"
                                    value="${optIndex + 1}"
                                >

                                <label
                                    for="q${index}_${optIndex}"
                                >
                                    ${text}
                                </label>

                            </div>

                            `
                        )
                        .join("")
                    }

                </div>

            </div>

            `;

        }
    );

    form.innerHTML = html;
}


/* =========================================================
   角色匹配
========================================================= */

function matchNarutoRole(userScore){

    let results = [];

    for(const role of narutoRoles){

        let distance = 0;

        for(let i=0;i<7;i++){

            distance +=
                Math.pow(
                    userScore[i] -
                    role.score[i],
                    2
                );

        }

        results.push({

            role:role,

            distance:distance

        });

    }

    results.sort(
        (a,b)=>
            a.distance -
            b.distance
    );

    return {

        best:results[0].role,

        second:results[1].role

    };
}

function setAvatar(imgElement,role){

    const fallback =
        createFallbackAvatar(
            role.name
        );

    imgElement.onerror =
        function(){

            this.onerror = null;

            this.src = fallback;

        };

    imgElement.src =
        role.imageUrl ||
        fallback;
}

/* =========================================================
   提交
========================================================= */

function submitTest(){

    let unanswered = 0;

    const answers = [];


    for(
        let i=0;
        i<questions.length;
        i++
    ){

        const selected =
            document.querySelector(
                `input[name="q${i}"]:checked`
            );

        if(!selected){

            unanswered++;

        }else{

            answers[i] =
                parseInt(
                    selected.value
                );

        }

    }


    if(unanswered > 0){

        alert(
            `还有 ${unanswered} 道题没有完成，请全部作答后提交。`
        );

        return;

    }


    /* =============================================
       计算七宗罪
    ============================================= */

    const sinScores =
        new Array(7).fill(0);


    questions.forEach(
        (question,index)=>{

            let score =
                answers[index];


            if(question.reverse){

                score =
                    6 - score;

            }


            sinScores[
                question.dim
            ] += score;

        }
    );


    /* 每个维度4道题 */

    for(
        let i=0;
        i<7;
        i++
    ){

        sinScores[i] =
            Number(
                (
                    sinScores[i] / 4
                ).toFixed(1)
            );

    }


    /* =============================================
       总分
    ============================================= */

    const totalSin =
        sinScores.reduce(
            (a,b)=>a+b,
            0
        );


    const totalVirtue =
        42 - totalSin;


    const diff =
        totalVirtue -
        totalSin;


    /* =============================================
       找最高罪性
    ============================================= */

    let maxSinIndex = 0;


    for(
        let i=1;
        i<7;
        i++
    ){

        if(
            sinScores[i] >
            sinScores[maxSinIndex]
        ){

            maxSinIndex = i;

        }

    }


    /* =============================================
       找最高美德
    ============================================= */

    let maxVirtueIndex = 0;


    for(
        let i=1;
        i<7;
        i++
    ){

        if(
            (6 - sinScores[i]) >
            (6 - sinScores[maxVirtueIndex])
        ){

            maxVirtueIndex = i;

        }

    }


    /* =============================================
       顶部结果
    ============================================= */

    document.getElementById(
        "topSinName"
    ).innerText =
        dimensions[maxSinIndex].sin;


    document.getElementById(
        "topSinScore"
    ).innerText =
        `得分：${sinScores[maxSinIndex].toFixed(1)}/6`;


    document.getElementById(
        "topVirtueName"
    ).innerText =
        dimensions[maxVirtueIndex].virtue;


    document.getElementById(
        "topVirtueScore"
    ).innerText =
        `得分：${(
            6 -
            sinScores[maxVirtueIndex]
        ).toFixed(1)}/6`;


    /* =============================================
       差值
    ============================================= */

    const diffElement =
        document.getElementById(
            "diffValue"
        );


    diffElement.innerText =

        (
            diff >= 0
            ? "+"
            : ""
        )
        +
        diff.toFixed(1)
        +
        "分";


    diffElement.style.color =
        diff >= 0
        ? "#16a34a"
        : "#b91c1c";


    /* =============================================
       分数明细
    ============================================= */

    let detailHTML = "";


    sinScores.forEach(
        (sinScore,index)=>{

            const virtueScore =
                6 - sinScore;


            const sinPercent =
                sinScore / 6 * 100;


            const virtuePercent =
                virtueScore / 6 * 100;


            detailHTML += `

            <div class="detail-item">

                <div class="detail-header">

                    <span>
                        ${dimensions[index].sin}
                        ↔
                        ${dimensions[index].virtue}
                    </span>

                    <span>
                        罪性${sinScore.toFixed(1)}
                        |
                        美德${virtueScore.toFixed(1)}
                    </span>

                </div>


                <div class="progress-wrap">

                    <div
                        class="progress-sin"
                        style="
                            width:${sinPercent}%
                        "
                    ></div>

                    <div
                        class="progress-virtue"
                        style="
                            width:${virtuePercent}%
                        "
                    ></div>

                </div>

            </div>

            `;

        }
    );


    document.getElementById(
        "detailList"
    ).innerHTML =
        detailHTML;


    /* =============================================
       雷达图
    ============================================= */

    drawRadar(
        sinScores
    );


    /* =============================================
       火影角色匹配
    ============================================= */

    const match =
        matchNarutoRole(
            sinScores
        );


    const best =
        match.best;


    const second =
        match.second;


    /* 第一角色 */

    document.getElementById(
        "narutoName"
    ).innerText =
        best.name;


    document.getElementById(
        "narutoDesc"
    ).innerText =
        best.desc;


    setAvatar(

        document.getElementById(
            "narutoImg"
        ),

        best

    );


    /* 第二角色 */

    document.getElementById(
        "narutoSecName"
    ).innerText =
        `第二匹配：${second.name}`;


    document.getElementById(
        "narutoSecDesc"
    ).innerText =
        second.desc;


    setAvatar(

        document.getElementById(
            "narutoSecImg"
        ),

        second

    );


    /* =============================================
       特殊角色
    ============================================= */

    document.getElementById(
        "specialRoleNotice"
    ).style.display =

        best.special
        ? "block"
        : "none";


    /* =============================================
       切换页面
    ============================================= */

    document.getElementById(
        "testPage"
    ).style.display =
        "none";


    document.getElementById(
        "resultPage"
    ).style.display =
        "block";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}
